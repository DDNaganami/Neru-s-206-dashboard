; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependency libraries
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html

[platformio]

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; 自定义分区表:在 spiffs 里切出 theme 分区(运行时主题文件)。
; 偏移 0x210000 与大小 0x4000 见 partitions.csv。
; ★ 别照抄旧文档里的 0x290000 —— 那个偏移落在 image 分区中间,刷了会覆盖图片资源。
board_build.partitions = partitions.csv
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -DDASH_DISPLAY_STUB=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  ; ★ -Iinclude 不能省:LVGL 找 lv_conf.h 靠的是包含路径
  ;   (LV_CONF_INCLUDE_SIMPLE → #include "lv_conf.h")。少了这一条,
  ;   include/lv_conf.h **根本不会被读**,一切走 LVGL 内部默认值 ——
  ;   而且不报错:14 号字体恰好是 LVGL 的默认值,看起来"生效了";
  ;   直到要开 48 号字体时才炸出 "lv_font_montserrat_48 was not declared"。
  -I include
  -I lib/dashcore
  -I lib/themetool

; ============================================================
; ESP32-S3 N16R8 —— **实车与真屏要用的那块板子**
;
; 为什么单独开一个 env、而不是把 esp32dev 改掉:
;   · 经典 ESP32(4MB flash / 无 PSRAM)还是个有用的**廉价回归环境**;
;   · 两块板子的分区表不同(16MB vs 4MB),但 theme / image 的**偏移刻意保持一致**
;     (0x210000 / 0x254000)—— 于是网页编辑器给出的 esptool 命令两块板通用,
;     不用记两套数字(这条由 tools/theme-editor 的偏移检查与文档一起兜着)。
;
; N16R8 = 16MB flash + 8MB **八线(OPI)** PSRAM:
;   · flash 走 QIO、PSRAM 走 OPI → memory_type = qio_opi
;   · OPI PSRAM 用的是 flash 那组总线,所以 GPIO33-37 **仍然可用**(见 PINOUT.md);
;     若换成 N16R2(四线 PSRAM 占 33-37),SPI 那片要整体挪脚。
;   · 8MB PSRAM 是"双 480×480 整屏缓冲"的前提(2×450KB 缓冲,还要留给 LVGL)。
;
; 串口:★ 2026-09-18 实测手上的板子**只有 native USB 口**
;   (设备管理器里 VID_303A:PID_1001,"USB JTAG/serial debug unit"),
;   所以把 USB 模式钉成 **HWCDC**,而不是板子定义里的 TinyUSB 默认值:
;     -DARDUINO_USB_MODE=0        USB 外设走 "Hardware CDC and JTAG"
;     -DARDUINO_USB_CDC_ON_BOOT=1 Serial 绑到 HWCDC(不开这条 Serial 是 UART0)
;   好处:COM 口不变、esptool 自动复位照常工作、刷完在同一个口看日志。
;   板子定义(esp32-s3-devkitc-1.json)写的是 -DARDUINO_USB_MODE=1(TinyUSB):
;   那个模式下跑起来之后 JTAG 串口会消失,上传往往要按住 BOOT 再点 RESET。
;   build_flags 排在 extra_flags 之后,所以这里的 0 生效。
;
;   如果你的 S3 板子是**带 USB-转串口桥**的(CH343/CP2102,两个 Type-C 口):
;   把这两行删掉,并插标着 UART 的那个口。
;
; 上传口由 platformio 自动找;找不到时用 `-p COMx` 指定(见 README 的刷写命令)。
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions-s3.csv
; ★★ 监视器必须**不要**碰 RTS/DTR —— 这是 ESP32-S3 原生 USB 口最坑的一条。
;
; USB-Serial-JTAG 把两条控制线直接接到复位/启动脚(esptool 就是靠这个复位的,
; 见 tool-esptoolpy/esptool/reset.py 的 USBJTAGSerialReset):
;     RTS = EN(复位)      DTR = GPIO0(启动模式)
; 它的复位序列最后一步是 `RTS=False, DTR=False` —— 注释写着 "Chip out of reset"。
; 而 pyserial **打开串口时默认把 RTS/DTR 都置位**,PlatformIO 的
; monitor_rts/monitor_dtr 又没给默认值(继承 pyserial 的 true) →
; 监视器一打开就把 EN 拉低,**芯片永远停在复位态**,屏幕上永远是空白。
;
; 实测(2026-09-18):刷完立刻开监视器 → 一片空白;以为固件没跑,其实是没让它跑。
; 加上这两行之后,监视器打开就能看到开机自检。
;
; (经典 ESP32 那边**故意不设**:USB-转串口桥的 DTR/RTS 是自动复位用的,
;  监视器打开时复位一次正好能看到从头开始的启动日志。)
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -DDASH_DISPLAY_STUB=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I include
  -I lib/dashcore
  -I lib/themetool
  ; ★ USB 模式:让 Serial 绑到 **HWCDC**(也就是手上这块板子的原生 USB 口)。
  ;   实测 + 查核 cores/esp32 得到的确切结论(2026-09-18):
  ;     HWCDC.h :  #if ARDUINO_USB_MODE         → extern HWCDC Serial;   ← 要的是这条
  ;     USBCDC.h:  #if CDC_ON_BOOT && !USB_MODE → extern USBCDC Serial;
  ;   也就是说 **USB_MODE 必须为 1**(板子定义 esp32-s3-devkitc-1.json 本来
  ;   就写着 -DARDUINO_USB_MODE=1,是给这个用的),我先前自作聪明改成 0,
  ;   结果 Serial 变成 TinyUSB 的 USBCDC —— 它在这块板子上没接管 USB,
  ;   于是所有 printf 石沉大海:串口一片空白,而芯片跑得好好的
  ;   (coredump 分区全 0xFF、USB 设备 12 秒不掉线,都是这么排掉的)。
  ;   所以:**不要**再给它加 -U/-D 覆盖,只补 CDC_ON_BOOT 这一条就够了。
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; 图片分区从 1MB 变成 8MB:宿主机与设备端那道"太大就拒收"的闸门要一起放宽,
  ; 否则镜像明明装得下却被打包器/加载器挡掉(见 image_blob.h 的 IMAGE_PARTITION_BYTES)。
  ; 这里用 -D 覆盖,而不是改 image_blob.h 的默认值 —— 经典 ESP32 那份必须保持 1MB。
  -DIMAGE_PARTITION_BYTES=(8u*1024u*1024u)
  ; ★ 打开 VAN 硬件接收(SN65HVD230 已到货):RO → GPIO16,DE/RE → GND。
  ;   不加这一条就是桩物理层 —— 收发器接好了也**一帧都不会进**,而串口上
  ;   只会看到 "van phy: stub",不会报错(开机自检那行就是给这个用的)。
  ;   想换引脚:-DVAN_RX_PIN=<n>(见 lib/dashcore/van_phy_gpio.cpp)。
  -DVAN_PHY_GPIO=1

; 用 test/arduino_shim 最小桩编译,不烧板即可验证解析/回退/状态机/主题解析。
[env:native]
platform = native
test_framework = unity
; lib 直接编进测试程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
; lib/themetool 是主题模块(结构 + 默认值 + JSON 解析 + 钳制),必须在宿主机
; 上可测 —— 主题文件是外部输入,钳制逻辑(除零/负半径/量程反了)正是最容易
; 让设备崩掉的地方。设备专属的分区读取在 src/theme_load.cpp,不参与 native 构建。
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -I include
  -I lib/dashcore
  -I lib/themetool
  -I test/arduino_shim
  -DLV_CONF_INCLUDE_SIMPLE=1

; 宿主机预览:同一套 UI 代码跑在 PC 上,渲染帧落 preview/frames/,
; 跑几秒后 Ctrl+C,浏览器打开 preview/preview.html 看双屏扫表动画(不用真屏)。
; 和设备共用同一份 include/lv_conf.h,保证渲染行为一致。
; 主题:设 THEME_FILE=<路径> 可加载主题文件(见 lib/themetool/theme_store.h),
; 不设则用 lib/themetool/ui_theme.h 里的默认值。
[env:pcpreview]
platform = native
; lib 直接编进程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -I include
  -I lib/dashcore
  -I lib/themetool
  -I preview/arduino_shim
  -DDASH_DISPLAY_PREVIEW=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_MEM_SIZE=2097152
