; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependency libraries
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html

[platformio]

[env:esp32dev]
; ★ 2026-09-24：平台**钉版本**。原因见 [env:esp32s3-rgb] 那段：本机现在同时装着
;   两套 espressif32（官方 **7.1.3** = arduino-esp32 2.0.17 / pioarduino **55.03.39**
;   = arduino-esp32 3.3.9 + IDF 5.5），而 PlatformIO 对**不带版本**的 `espressif32`
;   取"已安装里版本号最高的那个"（package/manager/base.py:`get_package` →
;   `pkg.metadata.version > best.metadata.version`）⇒ 不钉住的话，这条 env
;   **和 [env:esp32s3]（抓帧盒）会静默换成新平台**。
;   钉到 7.1.3 = 它本来就一直在用的那一版 ⇒ 平台与行为一个字都不变。
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
; 自定义分区表:在 spiffs 里切出 theme 分区(运行时主题文件)。
; 偏移 0x210000 与大小 0x4000 见 partitions.csv。
; ★ 别照抄旧文档里的 0x290000 —— 那个偏移落在 image 分区中间,刷了会覆盖图片资源。
board_build.partitions = partitions.csv
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -DDASH_DISPLAY_STUB=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  ; ★ -Iinclude 不能省:LVGL 找 lv_conf.h 靠的是包含路径
  ;   (LV_CONF_INCLUDE_SIMPLE → #include "lv_conf.h")。少了这一条,
  ;   include/lv_conf.h **根本不会被读**,一切走 LVGL 内部默认值 ——
  ;   而且不报错:14 号字体恰好是 LVGL 的默认值,看起来"生效了";
  ;   直到要开 48 号字体时才炸出 "lv_font_montserrat_48 was not declared"。
  -I include
  -I lib/dashcore
  -I lib/themetool
  ; 双板链路协议 v1（lib/link）：经典 ESP32 **不是**双板架构的板子（两块 S3 才是，
  ; 见 ARCHITECTURE.md「最终显示架构」），所以这里**只加包含路径**、不开
  ; -DLINK_PHY_UART（真实 UART 的 PHY 只在 S3 那边有理由编 —— 而且这个 env 上
  ;  Serial0/CDC 的型号前提也不成立）。纯逻辑层（帧/消息/时基/发送/接收/引脚常量）
  ; 照样能编，native 用例也是全绿的。
  -I lib/link

; ============================================================
; ESP32-S3 N16R8 —— **实车与真屏要用的那块板子**
;
; 为什么单独开一个 env、而不是把 esp32dev 改掉:
;   · 经典 ESP32(4MB flash / 无 PSRAM)还是个有用的**廉价回归环境**;
;   · 两块板子的分区表不同(16MB vs 4MB),但 theme / image 的**偏移刻意保持一致**
;     (0x210000 / 0x254000)—— 于是网页编辑器给出的 esptool 命令两块板通用,
;     不用记两套数字(这条由 tools/theme-editor 的偏移检查与文档一起兜着)。
;
; N16R8 = 16MB flash + 8MB **八线(OPI)** PSRAM:
;   · flash 走 QIO、PSRAM 走 OPI → memory_type = qio_opi
;   · 八线(OPI) PSRAM **硬件上固定占 GPIO33-37**(多出来的那几根 PSRAM 数据线/DQS
;     就引在这里)⇒ 33-37 **不可用**;只有**四线(Quad)PSRAM** 才不占这 5 根(见 PINOUT.md)。
;   · 8MB PSRAM 是"双 480×480 整屏缓冲"的前提(2×450KB 缓冲,还要留给 LVGL)。
;   · ★ `-DBOARD_HAS_PSRAM` **一个字都不能省**:cores/esp32/esp32-hal-psram.h 里写着
;       #ifndef BOARD_HAS_PSRAM
;       #undef CONFIG_SPIRAM
;     没有这个宏,核心会**主动把 PSRAM 编掉** —— 2026-09-18 实测:少了它,
;     自检那行就是 `psram : 0 KB 可用 / 0 KB 总`,而 memory_type 配得再对也没用
;     (板子本身是好的:esptool 认到 "Embedded PSRAM 8MB (AP_3v3)")。
;
; 串口(2026-09-18 实测,踩了大半天 —— 详见 ACCEPTANCE.md):
;   这块板子**两个 USB 口都有**:native USB(VID_303A:1001,USB-Serial-JTAG)
;   和板载 **CH340**(VID_1A86:7523,标着 UART)。插哪个口,差别是天壤:
;     · **UART 口(CH340)= 真 UART0 + 真 EN/IO0 复位线** —— 推荐刷写调试都走它:
;       ROM、二级 bootloader、panic 的日志全在这条线上,复位后第一个字节都抓得到;
;       刷完的 `--after hard_reset` 是真的"放开 EN 从 flash 启动",**app 会跑**。
;     · native USB 口 = USB-Serial-JTAG:它的"复位"只是**软复位请求**,
;       esptool 用 "DTR 拉低 IO0 + 脉冲 EN"(USBJTAGSerialReset)来表达,
;       于是刷完芯片**留在 ROM 下载模式**(ROM 日志里是 `boot:0x0`)。
;       更坑的是 pyserial **打开串口时默认把 DTR/RTS 都拉高**
;       (serialutil.py: _rts_state = _dtr_state = True)→ 开监视器这一下
;       又是一个"复位进下载模式"。两件事叠起来,看起来就是"固件根本没跑"。
;   USB 模式仍钉成 HWCDC(COM 口不变、插 native USB 口也能看日志):
;     HWCDC.h :  #if ARDUINO_USB_MODE         → extern HWCDC Serial;   ← 要的是这条
;     USBCDC.h:  #if CDC_ON_BOOT && !USB_MODE → extern USBCDC Serial;
;   所以 **不要**再给它加 -U/-D 覆盖 USB_MODE,只补 CDC_ON_BOOT 这一条。
;   固件日志**两个口都发**(见 lib/dashcore/dash_log.h),插哪个口都看得见。
;
; 上传口由 platformio 自动找;两个口都插着时必须显式指定:
;   python -m platformio run -e esp32s3 -t upload --upload-port COM4
; ============================================================
; ============================================================
; ESP32-S3 + RGB 并口屏（480×480）—— 实驱动骨架
;
; 与 [env:esp32s3] 的唯一差别:用 -DDASH_DISPLAY_RGB 打开真驱动
; （src/dash_display_rgb.cpp），并把桩驱动关掉（-U 去掉基环境里的
; DASH_DISPLAY_STUB）。
;
; ★★ 动手前先读 src/dash_display_rgb.cpp 的文件头:这一版框架自带的
;    esp_lcd_panel_rgb.h 是**旧精简版**（4 个芯片目录同一份，120 行），
;    只有 on_frame_trans_done 单个回调，**没有** num_fbs /
;    esp_lcd_rgb_panel_get_frame_buffer / register_event_callbacks ——
;    而"两块屏共用一条 16 位总线、轮流发帧"恰好需要那三样。
;    所以现在这个是**单屏**版本（第二块屏先用同一个 lv_display），
;    双屏的两条出路写在该文件头部。
;
; 屏到手后要填的只有那个文件顶部的三块:引脚 / 初始化命令表 / 时序。
; ============================================================
; ============================================================
; ESP32-S3 + **SPI** 屏（480×480，自带 GRAM 那族）—— 实驱动骨架
;
; 两块屏:共享 SCK/MOSI + 每屏 CS/DC/RST/BL ≈ 10 根,不需要转接板。
; 与 [env:esp32s3] 的差别只有:HWCDC 不变,打开 -DDASH_DISPLAY_SPI、
; 关掉桩驱动(-UDASH_DISPLAY_STUB)。
;
; ★★ 屏到手后只需要填 src/dash_display_spi.cpp 顶部那 5 段:
;    引脚 / 初始化命令表 / 窗口命令与偏移 / 字节序 / 背光。
;    其中**命令表必须从卖家例程抄** —— 空表会让屏不亮(代码里会明确报这一行)。
; ★ 代价(见 PURCHASE 第十一节):整屏刷新受 SPI 带宽限制(80MHz 下单屏 ~27fps、
;    两屏共用 ~13fps);我们的 UI 日常是局部刷新,够用。
;
; ============================================================
; 240 档验证用的板:微雪 ESP32-S3-DualEye-Touch-LCD-1.28
;   (ESP32-S3R8、两块 1.28" 240×240 圆屏 GC9A01A、CST816 触摸、ES8311/ES7210 音频)。
;   ★ 2026-09-22 已退货,现在手上没有这块硬件;本 env 与下面两个板级开关**保留且仍然有效**。
;   驱动里那五段已经照它的官方 wiki + 例程填好了,下面只剩两个**板级**编译开关。
; ============================================================
[env:esp32s3-spi]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -UDASH_DISPLAY_STUB
  -DDASH_DISPLAY_SPI=1
  ; ★ 分辨率:这块验证板是 **240×240** 圆屏,而 THEME_DISPLAY_RES 默认 480
  ;   (那是给最终 2.8" 屏留的)。不改这一条,lv_display_create 按 480 建屏,
  ;   CASET/RASET 会打到 240 的可寻址区外面 → 花屏。
  ;   主题几何按 THEME_DISPLAY_RES/THEME_BASE_RES 自动缩到 0.5 倍,主题代码不用动;
  ;   只影响本 env,esp32s3 / pcpreview 仍是 480。
  -DTHEME_DISPLAY_RES=240
  ; ★ VAN 接收脚:基环境默认的 GPIO16 在这块板上是 **I2S_DSDIN(ES8311)**,而且
  ;   没引到任何排座 —— 收发器根本接不进去。改用 **GPIO18 = SD_MISO**:
  ;   它在 **LCD2-Board 的 SH1.0 14PIN 第 3 脚**上,不用 TF 卡就空着。
  ;   (另一条路:LCD1-Board 第 9 脚的 UART_RXD = GPIO44,但那是 UART0 的 RX,
  ;    和 dash_log.h 的 Serial0 抢 —— 要用它得先让 UART0 只发不收。
  ;    ★ 2026-09-23 补:如果哪天这条 env 也带上 `-DLINK_PHY_UART`(也就是让日志
  ;      不再占 UART0),那"抢"这件事就不存在了 —— 今天它不带,所以仍然成立。)
  ;   待实测:SH1.0 转杜邦线接到收发器 RO 之后,看开机自检那行 van phy 是否有边沿。
  -DVAN_RX_PIN=18
[env:esp32s3-rgb]
extends = env:esp32s3
; ★★★ 2026-09-24：**只有这一条 env 换平台** —— 撕裂的根治要靠
;   `num_fbs`（双 framebuffer）+ `esp_lcd_rgb_panel_register_event_callbacks()`
;   的 `on_vsync` 回调，而这两样在官方 espressif32 7.1.3 自带的
;   `esp_lcd_panel_rgb.h`（129 行的旧精简版）里**根本不存在**（见
;   docs/RGB-PANEL-2.8C.md 第 5/9 节）。带它们的是 IDF 5.x 的 esp_lcd。
;
;   选型（理由见 docs/RGB-PANEL-2.8C.md 第 9 节）：
;     · **pioarduino 的 espressif32 分支 55.03.39** = arduino-esp32 **3.3.9** + **ESP-IDF 5.5.4**；
;     · 保留 Arduino 框架 ⇒ 应用层（main/dash_ui/lib/*）改动最小，只做 API 适配；
;     · 纯 ESP-IDF 方案被否掉：要把整个 Arduino 应用层重写，且与本轮目标无关。
;
;   ★ 为什么写 **URL** 而不是 `platform = espressif32@55.03.39`：
;     pioarduino 不在 PlatformIO 官方 registry 里，版本号只存在于这个 GitHub
;     release 的 zip 里；写 URL 才能让 PlatformIO 用 **spec.uri** 精确认出它
;     （package/meta.py `Spec.external`），而不是靠"版本最高的 espressif32"
;     这种会误伤别的 env 的规则。
;
;   ★★ 平台共存的边界（**实测过**，写在这里免得下次踩）：
;     两套平台的 `framework-arduinoespressif32` **争同一个 packages 目录名**
;     （pioarduino 的 spec 是自定义名 `framework-arduinoespressif32=<url>`，
;     `_install_tmp_pkg` 对自定义名一律 `overwrite` 到**不带版本的那个目录**）。
;     2026-09-24 实测的后果两条：
;       · **交替构建**（先本 env、再 esp32s3/esp32dev、再回来）时，回来那一次会把
;         框架包**重装一遍**：esp32dev 那次构建 168s、esp32s3 198s（含工具链），
;         之后本 env 是 26.8s —— 都从 PlatformIO 的本地下载缓存解包，**不走网络**；
;       · 交替之后**第一次**构建本 env 有几率直接报
;         `TypeError: expected str, bytes or os.PathLike object, not NoneType`（7s 就退）
;         —— **原地再跑一次就好**（第二次 26.8s 成功）。那是 pioarduino 在"共享包被
;         对方换掉"之后重建自己那套包时的状态问题，与本项目代码无关。
;       · 要两边都频繁构建，就让其中一个 env 用**独立的 core dir**
;         （`PLATFORMIO_CORE_DIR`）—— 但那样工具链要重新下一次，本机没采用。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
build_flags =
  ${env:esp32s3.build_flags}
  -UDASH_DISPLAY_STUB
  -DDASH_DISPLAY_RGB=1
  ; ★ 2026-09-24：**这一条是"在 2.1 板上看得见日志"的前提** ——
  ;   基环境(esp32s3)带着 `-DLINK_PHY_UART=1`，而 `dash_log.h` 见到它就令
  ;   `DASH_LOG_UART0 = 0` ⇒ 日志**一个字节都不写 UART0**、只走原生 USB-CDC。
  ;   可是在微雪 2.1/2.8C 这类整板上：UART0(GPIO43/44)= 板载 CH343P = **唯一的
  ;   Type-C 口**（也就是 COMx），而原生 USB(GPIO19/20)只引到 12PIN 排针上
  ;   —— 没有杜邦线时**够不着**。于是"日志只走 USB-CDC"= 串口一片空白，
  ;   而板子其实跑得好好的（2026-09-24 实机就是这个现象）。
  ;   ⇒ 显示构建里去掉那个链路 PHY：`DASH_LOG_UART0` 回到 1，COM 口上同时有
  ;     开机自检 / 每秒的 `rgb: frames=` / 以及**回放输入**
  ;     （`van_replay_poll()` 读的正是 `Serial0`，见 src/main.cpp）。
  ;   ★ 代价与边界（写在这儿，别让它变成暗坑）：这份构建里 **43/44 是"日志+回放"口**，
  ;     **不是**链路。真要在这种"UART0 被 CH343P 占着"的板子上跑双板链路，
  ;     得先把日志挪走（原生 USB 从 12PIN 引出来，或 `-DLINK_UART_PORT=1` 并
  ;     接受它换脚）。基环境 `[env:esp32s3]`（抓帧盒）**一个字都没动**。
  -ULINK_PHY_UART
  ; ★ 2026-09-24：**这份构建里 OBD 必须关掉** —— 不是"没插 ELM327"这么简单，
  ;   而是**引脚撞车**：OBD 的默认脚是 RX=GPIO17 / TX=GPIO18（main.cpp 的
  ;   OBD_RX_PIN/OBD_TX_PIN），而 2.1/2.8C 这块板的 GPIO17/GPIO18 正是
  ;   RGB 并口的 **DATA15/DATA14**（见 src/dash_display_rgb.cpp 第 1 块）。
  ;   `attachObdSerial()` 在 setup() 里**先于** `dash_display_init()` 跑，
  ;   于是 Serial1 会先把 17/18 抓走 —— 之后 LCD 矩阵再把这两根抢回去
  ;   （最后写的赢），屏能亮，但 OBD 那一路静默失效、还白占两格 GPIO 矩阵。
  ;   `-DOBD_SERIAL=0` 是 main.cpp 里**早就写好的**那条开关（注释原话：
  ;   "没有 OBD 硬件时编译加 -DOBD_SERIAL=0，退回 Sim 假数据"），用它最干净。
  ;   ⇒ 这块板上 speed/rpm 的来源就是 Sim / **VAN 回放**（今天的协同就是后者）。
  -DOBD_SERIAL=0
  ; ★★ 2026-09-24（第三轮）：**bounce buffer = 本轮把"图像残留 + 撕裂"一起解决的那一条**。
  ;   出处：微雪官方 2.8C 例程（ESP32-S3-LCD-2.8C-Demo.zip →
  ;   ESP-IDF/ESP32-S3-LCD-2.8C-Test/main/LCD_Driver/ST7701S.c）的
  ;       .num_fbs = EXAMPLE_LCD_NUM_FB,
  ;       .bounce_buffer_size_px = 10 * EXAMPLE_LCD_H_RES,   ← Kconfig 默认 y
  ;   为什么少了它"双 fb 换帧"根本不生效（每个 VSYNC 都把 DMA 重置回固定的 fbs[0]）、
  ;   加了它为什么就生效（DMA 只读内部 bounce buffer，换帧由驱动在**帧边界**锁进
  ;   bb_fb_index）—— IDF 5.5.4 的逐行证据写在 src/dash_display_rgb.cpp 的文件头。
  ;   ★ `-DRGB_BOUNCE_LINES=0` 退回旧行为（屏上只有 fbs[0]，残留+撕裂会回来；
  ;     只在"复现/对照"时用）。10 行必须能整除 480 行（480/10=48 次/帧），否则
  ;     esp_lcd_new_rgb_panel() 会以 ESP_ERR_INVALID_ARG 失败并打日志。
  -DRGB_BOUNCE_LINES=10
  ; ★ 运行期"全屏重绘 / 局部刷新"对比档（任务书要求的那个可测开关）：
  ;   ★★ 2026-09-24 第四轮：**自动交替默认关掉了**（`ALTERNATE=0`）——
  ;   车主在"残留已修好、但还看到抖动/横纹"的那一刻，屏上正好有一半时间跑在
  ;   "全屏重绘"档（上一版是每 10s 自动切一档）。全屏重绘每次要 25ms 搬 450KB
  ;   （实测整屏 90~130ms 一张），本身就是**PSRAM/CPU 的大户**，会把这个诊断
  ;   搅浑（分不清是驱动的问题还是这个对照档的问题）⇒ 交付档**固定局部刷新**。
  ;   要做 A/B 时再把 ALTERNATE 设成 10000（每 10s 自动切）或把 DEFAULT 设 1（钉死全屏）。
  ;   判据：每秒那行 `rgb: ... 模式=全屏重绘|局部刷新 ...`。
  -DRGB_FULL_REFRESH_DEFAULT=0
  -DRGB_FULL_REFRESH_ALTERNATE_MS=0
; ★ VAN 接收极性翻转(2026-09-22 新增) —— 判断"edges 正常涨、frames 却为 0"是不是极性反了。
;   症状与判据见 lib/dashcore/van_phy_gpio.cpp 开头的 VAN_RX_INVERT 说明:
;   真总线约 3400 边沿/秒、而 frames 始终 0,反相后 SOF(0000111101)永远匹配不上,
;   边沿计数却完全不受影响 —— 这正是极性接反的签名。
;   用法:python -m platformio run -e esp32s3-vaninv -t upload
;   若这一版 frames 开始涨 => 确认极性反了,正式修法是**把 9004/9005 对调**
;   (比长期带着这个宏干净),然后回到 [env:esp32s3] 重新烧。
[env:esp32s3-vaninv]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DVAN_RX_INVERT=1
; ★ VAN 帧嗅探(2026-09-22 新增) —— 按 IDEN 统计解出的帧,不依赖任何字符串格式化。
;   起因:实测发现 VanLogSink 的 "VAN %03X ..." 帧行一行都没打印(格式串在固件里、
;   sink 链接法正确、dash_logf 无节流),导致"实车流里有哪些 IDEN"无法观察 ——
;   而车速(IDEN 0x824)在不在流里,直接决定 SRC speed 能不能从 sim 变 van。
;   用法:python -m platformio run -e esp32s3-vansniff -t upload --upload-port COM3
;   看 'sniff: 共 N 帧, IDEN: ...' 与 'sniff: 车速帧 IDEN 0x824 计数 = ...' 两行。
;   若这两行能出来而 "VAN %03X" 出不来 => 问题在那一条 dash_logf 调用,不在整个 sink。
[env:esp32s3-vansniff]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DVAN_SNIFF=1

; ============================================================
; ★ 单板回环验证固件（2026-09-23 新增）—— **不需要第二块板**
;
; 用途：在一块裸 S3 上把 lib/link 的收/发整条链跑一遍（真实 UART 的字节流上验
;   CRC/帧长/大端字节序/两个环的溢出），接线只有**一根**短路线。
;   ★ 把 **GPIO17 与 GPIO18 短接**，然后：
;       python -m platformio run -e esp32s3-linkloop -t upload --upload-port COM4
;     串口 115200 上应当看到 `linkloop: === 汇总 ===` 那一段，最后一行 `linkloop: PASS`。
;   完整接线说明与期望输出（含每一行的含义）见 docs/LINK-LOOPBACK.md。
;
; 与 [env:esp32s3] 的差别只有四项（都写在这里，别在别处再抄一遍）：
;   ① -DLINK_LOOPBACK_FIRMWARE=1：把 src/main.cpp 整个摘掉（同一个 env 只能有一个
;      setup()/loop()），由 src/link_loopback.cpp 提供入口。
;   ② -DLINK_PHY_LOOPBACK=1：link_phy_pins.h 的回环口径（UART1 + GPIO17/18）。
;      ★ 那两个脚**不是** 43/44：裸 S3 devkit 上 43/44 接着板载 USB-串口桥，
;        短接会把桥的推挽 TX 也并进回路（§8 L1 的那颗 FSUSB42UMX 摘不掉它）。
;   ③ -DLINK_ROLE=1：单板同时扮演两端时的编译期角色口径（见 link_role.h）。
;      ★ 这里**不再**写 `-DLINK_PHY_UART_ALLOW_LOG_ON_UART0=1`（那条豁免 2026-09-23 已退役）：
;      本固件**不调用 dash_log_begin()**（`src/link_loopback.cpp` 直接用 USB-CDC 的
;      `Serial`），而 `dash_log.h` 在定义了 `LINK_PHY_UART` 的构建里默认就不写 UART0
;      ⇒ 日志那一路本来就不碰 43/44。
;   ④ 继续带着 -DDASH_DISPLAY_STUB（继承自 esp32s3）：本固件里**没有**显示代码
;      （src/dash_display.cpp 用的是桩那一支），所以显示驱动那块的"未实现"闸门
;      不会被触发 —— 而 src/link_loopback.cpp 一个显示符号都不引用。
;      ★ 别在这里写 -UDASH_DISPLAY_STUB：那会去编真显示驱动的那一支，而它现在
;        本来就编不过（`#error "dash_display 实驱动尚未实现"`，与链路无关）。
; ============================================================
[env:esp32s3-linkloop]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DLINK_LOOPBACK_FIRMWARE=1
  -DLINK_PHY_LOOPBACK=1
  -DLINK_ROLE=1

[env:esp32s3]
; ★★ 2026-09-24：**这一行只加了 `@7.1.3`，平台本身没换** —— 就是它从 2026-09-18
;   起一直在用的官方 espressif32 7.1.3（arduino-esp32 2.0.17 / IDF 4.4 系）。
;   为什么必须显式钉版本：本机现在同时装着 pioarduino 的 55.03.39（见
;   [env:esp32s3-rgb]），而 PlatformIO 对不带版本的 `espressif32` 取**已安装里
;   版本号最高**的那个 ⇒ 不钉住，**这条抓帧盒 env 会被静默升到 arduino-esp32 3.x**，
;   那是本项目的红线。钉住之后：平台、框架、工具链、行为全部与上一轮逐字节相同。
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions-s3.csv
; ★★ 监视器必须**不要**碰 RTS/DTR —— 这是 ESP32-S3 原生 USB 口最坑的一条。
;
; USB-Serial-JTAG 把两条控制线直接接到复位/启动脚(esptool 就是靠这个复位的,
; 见 tool-esptoolpy/esptool/reset.py 的 USBJTAGSerialReset):
;     RTS = EN(复位)      DTR = GPIO0(启动模式)
; 它的复位序列最后一步是 `RTS=False, DTR=False` —— 注释写着 "Chip out of reset"。
; 而 pyserial **打开串口时默认把 RTS/DTR 都置位**,PlatformIO 的
; monitor_rts/monitor_dtr 又没给默认值(继承 pyserial 的 true) →
; 监视器一打开就把 EN 拉低,**芯片永远停在复位态**,屏幕上永远是空白。
;
; 实测(2026-09-18):刷完立刻开监视器 → 一片空白;以为固件没跑,其实是没让它跑。
; 加上这两行之后,监视器打开就能看到开机自检。
;
; (经典 ESP32 那边**故意不设**:USB-转串口桥的 DTR/RTS 是自动复位用的,
;  监视器打开时复位一次正好能看到从头开始的启动日志。)
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -DDASH_DISPLAY_STUB=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I include
  -I lib/dashcore
  -I lib/themetool
  ; 双板链路协议 v1（lib/link）的真实 UART PHY —— 口径与 [env:esp32dev] 那段一样：
  ; 纯逻辑层两头都编，UART PHY 只进固件构建。
  -I lib/link
  -DLINK_PHY_UART=1
  ; ★ 日志与链路口的关系（2026-09-23 收口）：链路走 UART0（契约 §0 的 43/44），
  ;   而 `dash_log.h` 现在按**这份固件里有没有链路 PHY** 决定"日志要不要写 UART0" ——
  ;   上面那一行 `-DLINK_PHY_UART=1` 就是那个判据 ⇒ 本 env（以及所有 extends 它的
  ;   显示/链路 env）里 `DASH_LOG_UART0` 自动为 **0**：`dash_log_begin()` 不开 `Serial0`、
  ;   `dash_logf()` 不写 `Serial0`，日志只走原生 USB-CDC。
  ;   ⇒ §0「载体」那条待办（"显示构建必须关掉 UART0 文本日志"）到此做掉，
  ;     在这里**再也不需要**写 `-DLINK_PHY_UART_ALLOW_LOG_ON_UART0=1` 那种豁免
  ;     （那条宏已退役、恒为 0，见 lib/link/link_phy_pins.h）。
  ;   ★ 而 VAN 采集那条路不受影响：它**不带** `-DLINK_PHY_UART`（见 [env:esp32dev] 那段
  ;     与 main.cpp 的 LINK_ROLE 分支）⇒ `DASH_LOG_UART0` 还是 1，双通道日志原样保留。
  ;   ★ 想显式钉住（例如临时要恢复双通道）就 `-DDASH_LOG_UART0=1` —— 但那会与链路抢
  ;     UART0，`lib/link/link_phy_uart.cpp` 的编译期闸门会当场报错。
  ; ★ PSRAM:**没有这一条,核心会把 CONFIG_SPIRAM 整个 #undef 掉**(见上面那段)。
  ;   少它的现象是自检报 `psram : 0 KB 可用 / 0 KB 总`,而板子其实是好的。
  -DBOARD_HAS_PSRAM
  ; OBD 车速(010D):默认策略是"开机问 0100 位图,ECU 说支持才轮询它"
  ; (见 lib/dashcore/obd_source.h 的"轮询时隙的账")。
  ; 想量"加/不加车速那一路"对其它字段刷新率的影响,编译时加 -DOBD_SPEED_PID=0
  ; 关掉它,对比串口上那行 `SRC-Hz`。
  ; 有线 ELM327 接好、把 main.cpp 里 g_data 换成 &Serial1 之后才会真正开始问。
  ; ★ USB 模式:让 Serial 绑到 **HWCDC**(也就是手上这块板子的原生 USB 口)。
  ;   实测 + 查核 cores/esp32 得到的确切结论(2026-09-18):
  ;     HWCDC.h :  #if ARDUINO_USB_MODE         → extern HWCDC Serial;   ← 要的是这条
  ;     USBCDC.h:  #if CDC_ON_BOOT && !USB_MODE → extern USBCDC Serial;
  ;   也就是说 **USB_MODE 必须为 1**(板子定义 esp32-s3-devkitc-1.json 本来
  ;   就写着 -DARDUINO_USB_MODE=1,是给这个用的),我先前自作聪明改成 0,
  ;   结果 Serial 变成 TinyUSB 的 USBCDC —— 它在这块板子上没接管 USB,
  ;   于是所有 printf 石沉大海:串口一片空白,而芯片跑得好好的
  ;   (coredump 分区全 0xFF、USB 设备 12 秒不掉线,都是这么排掉的)。
  ;   所以:**不要**再给它加 -U/-D 覆盖,只补 CDC_ON_BOOT 这一条就够了。
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; 图片分区从 1MB 变成 8MB:宿主机与设备端那道"太大就拒收"的闸门要一起放宽,
  ; 否则镜像明明装得下却被打包器/加载器挡掉(见 image_blob.h 的 IMAGE_PARTITION_BYTES)。
  ; 这里用 -D 覆盖,而不是改 image_blob.h 的默认值 —— 经典 ESP32 那份必须保持 1MB。
  -DIMAGE_PARTITION_BYTES=(8u*1024u*1024u)
  ; ★ 打开 VAN 硬件接收(SN65HVD230 已到货):RO → GPIO16,DE/RE → GND。
  ;   不加这一条就是桩物理层 —— 收发器接好了也**一帧都不会进**,而串口上
  ;   只会看到 "van phy: stub",不会报错(开机自检那行就是给这个用的)。
  ;   想换引脚:-DVAN_RX_PIN=<n>(见 lib/dashcore/van_phy_gpio.cpp)。
  -DVAN_PHY_GPIO=1

; 用 test/arduino_shim 最小桩编译,不烧板即可验证解析/回退/状态机/主题解析。
[env:native]
platform = native
test_framework = unity
; lib 直接编进测试程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
; lib/themetool 是主题模块(结构 + 默认值 + JSON 解析 + 钳制),必须在宿主机
; 上可测 —— 主题文件是外部输入,钳制逻辑(除零/负半径/量程反了)正是最容易
; 让设备崩掉的地方。设备专属的分区读取在 src/theme_load.cpp,不参与 native 构建。
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -I include
  -I lib/dashcore
  -I lib/themetool
  ; 双板链路协议 v1(lib/link)是纯逻辑层,先只在宿主机测试里编 ——
  ; 固件侧一行都还没接(src/ 没有 include 它),所以别的 env 不加这一条。
  ; 角色宏 LINK_ROLE 默认 0 = 从板(见 lib/link/link_role.h),宿主机不需要覆盖它。
  -I lib/link
  -I test/arduino_shim
  ; ★ 2026-09-24：**不给 native 加 `-I src`**，虽然本轮新加了两组"视图/注入"
  ;   用例。为什么：`lib_archive = no` 的 native 构建**只编 lib/ 下的源码**
  ;   （实测：把纯函数放在 src/*.cpp 里，用例会拿到
  ;    `undefined symbol: preview_apply_key(...)` 而链接失败）。
  ;   所以要让某一层在宿主机上可测，它就得**住在 lib/ 里**：
  ;     · 指示灯槽位的几何与映射 → `src/ui_model.h`（只被 pcpreview 编译，
  ;       因为设备端三块屏的驱动还没定，而它依赖的 ui_theme 也要 LVGL）；
  ;     · 注入的语义（纯函数）→ `lib/dashcore/preview_input.h`（inline）。
  ;   这条"想测谁就把它放进 lib/"是**有意的结构约束**，别用加包含路径绕过去。
  -DLV_CONF_INCLUDE_SIMPLE=1

; 宿主机预览:同一套 UI 代码跑在 PC 上,渲染帧落 preview/frames/,
; 跑几秒后 Ctrl+C,浏览器打开 preview/preview.html 看双屏扫表动画(不用真屏)。
; 和设备共用同一份 include/lv_conf.h,保证渲染行为一致。
; 主题:设 THEME_FILE=<路径> 可加载主题文件(见 lib/themetool/theme_store.h),
; 不设则用 lib/themetool/ui_theme.h 里的默认值。
[env:pcpreview]
platform = native
; lib 直接编进程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -I include
  -I lib/dashcore
  -I lib/themetool
  -I preview/arduino_shim
  -DDASH_DISPLAY_PREVIEW=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_MEM_SIZE=2097152
