; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -DDASH_DISPLAY_STUB=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I lib/dashcore

; 宿主机单元测试:纯逻辑层(lib/dashcore)不依赖 Arduino/LVGL,
; 用 test/arduino_shim 最小桩编译,不烧板即可验证解析/回退/状态机。
[env:native]
platform = native
test_framework = unity
; lib 直接编进测试程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
build_flags =
  -I lib/dashcore
  -I test/arduino_shim

; 宿主机预览:同一套 UI 代码跑在 PC 上,渲染帧落 preview/frames/,
; 跑几秒后 Ctrl+C,浏览器打开 preview/preview.html 看双屏扫表动画(不用真屏)。
; 和设备共用同一份 include/lv_conf.h,保证渲染行为一致。
[env:pcpreview]
platform = native
; lib 直接编进程序,不产 .a(宿主机没有 ar 也能跑)
lib_archive = no
lib_deps =
  lvgl/lvgl@^9.3.0
build_flags =
  -I include
  -I lib/dashcore
  -I preview/arduino_shim
  -DDASH_DISPLAY_PREVIEW=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_MEM_SIZE=2097152
